 jen_dragon_court_debug_pulse_desc: "Eligibility written to error.log / game.log. Console debug (or AGOT Debug game rule) must be on to see BotD: test court events on yourself."

 jen_dragon_court.1002.t: "What the Thief Said"
 jen_dragon_court.1002.desc: "The Watcher has had days with the thief in the dark. The clutch is quiet. The thief is not. They will say whatever keeps them breathing."
 jen_dragon_court.1002.a: "Leave them there. The vault will remember."
 jen_dragon_court.1002.a.tt: "A little dread and prestige. They stay in the dungeon."
 jen_dragon_court.1002.b: "Turn them out. They have seen enough."
 jen_dragon_court.1002.b.tt: "They go free and are grateful. A little prestige lost."
 jen_dragon_court.1002.c: "Hang them where the court can see."
 jen_dragon_court.1002.c.tt: "Dread and tyranny. The thief dies."

 jen_dragon_court.2001.t: "Still the Yard"
 jen_dragon_court.2001.desc: "A fortnight in the same mud. The dragon has the length of a horse and the habits of a hound. It still turns its head when a voice it knows comes across the pens."
 jen_dragon_court.2001.a: "Good. Let it hear us."
 jen_dragon_court.2001.a.tt: "A little stress lost. Dragon lifestyle experience. The Keeper is pleased."
 jen_dragon_court.2001.b: "The smallfolk will learn the size of it."
 jen_dragon_court.2001.b.tt: "A little prestige. A little dread."

 jen_dragon_court.2002.t: "Stone and Chain"
 jen_dragon_court.2002.desc: "The first night under the dome. The Pitmaster says it took the chain. The dragon did not sleep. Something in the dark learned the sound of its own wings against stone."
 jen_dragon_court.2002.a: "This is what pits are for."
 jen_dragon_court.2002.a.tt: "A little dread. Dragon lifestyle experience. The Pitmaster is pleased."
 jen_dragon_court.2002.b: "Watch it. If the rings sing, we open them."
 jen_dragon_court.2002.b.tt: "A little stress. A little prestige. You keep a hand on the door."

 jen_dragon_court.3201.t: "The Slight Travels"
 jen_dragon_court.3201.desc: "The Blood Chamberlain says the guest did not stay for the last cup. The insult has a horse, and it is already on the road to someone else's hall."
 jen_dragon_court.3201.a: "Send a gift. Call it a mistake of the seating."
 jen_dragon_court.3201.a.tt: "Gold to soften it. A little prestige lost. The guest is pleased."
 jen_dragon_court.3201.b: "Let them carry it. I meant the seat."
 jen_dragon_court.3201.b.tt: "Dread and a little prestige. The guest stays angry."

