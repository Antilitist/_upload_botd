l_english:
 jen_dragon_court.1000.t: "The Clutch Runs Hot"
 jen_dragon_court.1000.desc: "The Egg Watcher has not slept. One egg has gone from warm to fevered, and the sand around it is dark as if something underneath were breathing."
 jen_dragon_court.1000.a: "Keep the watch. Bank the coals."
 jen_dragon_court.1000.a.tt: "A little prestige. The Watcher is glad you listened."
 jen_dragon_court.1000.b: "Let it burn. Heat is how they come."
 jen_dragon_court.1000.b.tt: "A little gold from selling the extra coal. A little stress."
 jen_dragon_court.1000.c: "You know this sand. Sit with it."
 jen_dragon_court.1000.c.tt: "A capable Watcher. Prestige, and a bit of Dragon lifestyle experience."

 jen_dragon_court.1001.t: "A Step in the Vault"
 jen_dragon_court.1001.desc: "Night in the egg vault. The Watcher heard a boot that was not theirs, and a breath that did not belong to the clutch."
 jen_dragon_court.1001.a: "Take them. The Watcher already has the name."
 jen_dragon_court.1001.a.tt: "A capable Watcher. The thief goes to the dungeon. Prestige, and Dragon lifestyle experience."
 jen_dragon_court.1001.b: "Hang a thief where the court can see."
 jen_dragon_court.1001.b.tt: "A little dread. A little tyranny. The accused will not forget it."
 jen_dragon_court.1001.c: "Search the yard at dawn. Whoever it was is gone."
 jen_dragon_court.1001.c.tt: "Gold and prestige dribble away. The egg is still there. You do not sleep."

 jen_dragon_court.1100.t: "The Sheep"
 jen_dragon_court.1100.desc: "A hatchling found the sheep-pen. There is wool in the straw, blood on the gate, and a keeper in the yard who would like a word."
 jen_dragon_court.1100.a: "Pay the shepherds. Keep the peace."
 jen_dragon_court.1100.a.tt: "Gold to the shepherds. A little prestige. The Keeper is satisfied."
 jen_dragon_court.1100.b: "The Keeper already has it in hand."
 jen_dragon_court.1100.b.tt: "A capable Keeper. Prestige, and a bit of Dragon lifestyle experience. No extra gold this time."
 jen_dragon_court.1100.c: "Let the smallfolk learn what shares a yard with dragons."
 jen_dragon_court.1100.c.tt: "A little dread. A little prestige lost. The tale will travel."

 jen_dragon_court.1101.t: "The Yard Is Too Small"
 jen_dragon_court.1101.desc: "The Keeper of the Yard stands in the mud and says what you can already see. The dragon has the length of a horse now, and the pens were built for something that still fit in two hands."
 jen_dragon_court.1101.a: "Raise the fences. Widen the run."
 jen_dragon_court.1101.a.tt: "Spend gold to enlarge the yard. The Keeper is pleased."
 jen_dragon_court.1101.b: "Call the Pitmaster. Let them argue it."
 jen_dragon_court.1101.b.tt: "The Keeper and the Pitmaster will have it out in front of you."
 jen_dragon_court.1101.c: "It stays. The yard will learn."
 jen_dragon_court.1101.c.tt: "Stress, a little prestige lost. The Keeper is not pleased."

 jen_dragon_court.2000.t: "Yard or Pit"
 jen_dragon_court.2000.desc: "The dragon is past the easy years. The Keeper of the Yard wants it among the other beasts, where it still hears voices. The Pitmaster wants stone, chain, and a roof that will hold when the wings remember they are wings."
 jen_dragon_court.2000.a: "Keep it in the yard."
 jen_dragon_court.2000.a.tt: "Gold to hold the pens. The Keeper is pleased. The Pitmaster is not."
 jen_dragon_court.2000.b: "Send it to the pit."
 jen_dragon_court.2000.b.tt: "A little dread. The Pitmaster is pleased. The Keeper is not."
 jen_dragon_court.2000.c: "You will have both. Yard by day, stone by night."
 jen_dragon_court.2000.c.tt: "Both are capable, and both will take it. Prestige, and Dragon lifestyle experience."
 jen_dragon_court.2000.d: "Not today. Let it grow where it stands."
 jen_dragon_court.2000.d.tt: "Nothing is decided. You take the stress of two offices talking over you."

 jen_dragon_court.1200.t: "The Chains"
 jen_dragon_court.1200.desc: "The Pitmaster comes up from the dark with iron on their gloves. A grown dragon tested the rings last night, and one of them is no longer round."
 jen_dragon_court.1200.a: "New iron. Pay the smiths."
 jen_dragon_court.1200.a.tt: "Gold for new chains. A little prestige. The Pitmaster is pleased."
 jen_dragon_court.1200.b: "The Pitmaster already has spare rings."
 jen_dragon_court.1200.b.tt: "A capable Pitmaster. Prestige, and a bit of Dragon lifestyle experience."
 jen_dragon_court.1200.c: "If it wants out, let it learn the roof."
 jen_dragon_court.1200.c.tt: "A little dread. You take the stress of a dragon that knows the chains are weak."

 jen_dragon_court.1300.t: "A Wing Over the Village"
 jen_dragon_court.1300.desc: "The Wingmaster took a beast for air. A village below saw the shadow, and someone ran. There are broken carts in the road and a story already moving faster than the dragon did."
 jen_dragon_court.1300.a: "Pay them. Call it a training flight."
 jen_dragon_court.1300.a.tt: "Gold to the village. A little prestige lost."
 jen_dragon_court.1300.b: "Let them learn the shape of the sky."
 jen_dragon_court.1300.b.tt: "Dread, and a little prestige. The tale will do the rest."
 jen_dragon_court.1300.c: "The Wingmaster will put it right."
 jen_dragon_court.1300.c.tt: "A capable Wingmaster. Prestige, and a bit of Dragon lifestyle experience."

 jen_dragon_court.1400.t: "Name the Blood"
 jen_dragon_court.1400.desc: "The Bloodbinder has a dragonseed in the hall who wants the blood spoken aloud. Not a seat. A name. The kind of thing that cannot be taken back once the court has heard it."
 jen_dragon_court.1400.a: "Say it. They are of the blood."
 jen_dragon_court.1400.a.tt: "The seed is grateful. A little prestige, and Dragon lifestyle experience."
 jen_dragon_court.1400.b: "Blood is a house, not a rumor."
 jen_dragon_court.1400.b.tt: "Prestige with the court. The seed will not forget the refusal."
 jen_dragon_court.1400.c: "Let the Bloodbinder find the quiet form of it."
 jen_dragon_court.1400.c.tt: "A capable Bloodbinder. Both of them can live with the answer."

 jen_dragon_court.1500.t: "The Book"
 jen_dragon_court.1500.desc: "The Scale-scribe has the old list of names and the living dragon in the yard, and they do not match. Someone wrote the line wrong, or the beast has been called by a name that was never its own."
 jen_dragon_court.1500.a: "Write what we call it. Let the book follow the yard."
 jen_dragon_court.1500.a.tt: "A little prestige. The Scale-scribe is pleased. A bit of Dragon lifestyle experience."
 jen_dragon_court.1500.b: "Use the old name. The book is older than we are."
 jen_dragon_court.1500.b.tt: "Prestige. A little stress. The court will hear the old name."
 jen_dragon_court.1500.c: "Leave both. A dragon answers to fire, not ink."
 jen_dragon_court.1500.c.tt: "A little gold from selling a copy of the page. A little prestige lost."

 jen_dragon_court.1600.t: "Two Cradles"
 jen_dragon_court.1600.desc: "The Cradle Nurse keeps a dragonlord child and a hatchling in the same rooms. She says the child already knows which one to watch when the coals shift."
 jen_dragon_court.1600.a: "Let them grow in one air."
 jen_dragon_court.1600.a.tt: "A little stress lost. Dragon lifestyle experience. The Nurse is pleased."
 jen_dragon_court.1600.b: "The child will learn the yard later. Not the cradle."
 jen_dragon_court.1600.b.tt: "A little prestige. A little dread. The rooms stay divided."
 jen_dragon_court.1600.c: "Take the hatchling out. The Nurse worries too much."
 jen_dragon_court.1600.c.tt: "Stress. The hatchling goes back to the yard."

 jen_dragon_court.3000.t: "The Rider Says No"
 jen_dragon_court.3000.desc: "War is a word in the hall. The Master of Dragons named a rider, and the rider named a reason they will not go. The wings are ready. The will is not."
 jen_dragon_court.3000.a: "They fly, or they hang."
 jen_dragon_court.3000.a.tt: "Dread. The rider is angry."
 jen_dragon_court.3000.b: "Rest the wings. We will not spend them on pride."
 jen_dragon_court.3000.b.tt: "A little prestige lost. A little stress. The rider is pleased."
 jen_dragon_court.3000.c: "The Master will bring them to it."
 jen_dragon_court.3000.c.tt: "A capable Master of Dragons. Prestige, and Dragon lifestyle experience."

 jen_dragon_court.3100.t: "Smoke Over the City"
 jen_dragon_court.3100.desc: "The Lord of the Pit has the numbers and the smell. The city hates the cost of the pens, and the smoke that comes off the dome when the fires are fed."
 jen_dragon_court.3100.a: "Open the vaults. Widen the yards."
 jen_dragon_court.3100.a.tt: "Gold to expand. A little prestige. The Lord of the Pit is pleased."
 jen_dragon_court.3100.b: "The city will live with dragons, or it will not live here."
 jen_dragon_court.3100.b.tt: "A little dread. A little prestige lost."
 jen_dragon_court.3100.c: "The Lord already knows which stones to move."
 jen_dragon_court.3100.c.tt: "A capable Lord of the Pit. Less gold, more prestige, and Dragon lifestyle experience."

 jen_dragon_court.3200.t: "A Guest of the Blood"
 jen_dragon_court.3200.desc: "A dragonlord is in the hall, and the Blood Chamberlain says they were seated as if they were anyone. There is a look that follows that kind of mistake across a feast."
 jen_dragon_court.3200.a: "Raise their seat. Make the gift."
 jen_dragon_court.3200.a.tt: "Gold for the honor. A little prestige. The guest is pleased."
 jen_dragon_court.3200.b: "They will sit where I put them."
 jen_dragon_court.3200.b.tt: "Prestige and a little dread. The guest takes it as an insult."
 jen_dragon_court.3200.c: "Show them an egg. That is honor enough."
 jen_dragon_court.3200.c.tt: "Needs an egg. Prestige, a little stress, and Dragon lifestyle experience."

