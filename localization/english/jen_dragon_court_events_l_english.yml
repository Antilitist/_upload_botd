 jen_debug_fire_3201: "Fire: The Slight Travels"

 jen_seed_dragon_egg_decision: "Seed a Dragon Egg"
 jen_seed_dragon_egg_decision_desc: "The Bloodbinder will cut a dragonblood palm and paint the shell. The egg will know that line. Cradled by that house, it wakes easier. Cradled by another, it goes cold.\n\n#help You need a Bloodbinder and a live egg that has not already been seeded. The rite costs blood: stress, and a year of weakness.#!"
 jen_seed_dragon_egg_decision_tooltip: "Bleed on a dragon egg so it remembers your line"
 jen_seed_dragon_egg_decision_confirm: "Call the Bloodbinder"
 jen_seed_dragon_egg_decision_effect_tt: "The Bloodbinder prepares the shell"
 jen_seed_egg_need_blood_tt: "You or a dragonblood kinsman at court must give the blood"
 jen_seed_egg_applied_tt: "This egg is seeded. Cradled by that house, it is likelier to hatch. Cradled by another, it is likelier to go stone."
 jen_let_blood: "Let Blood"
 jen_let_blood_desc: "A palm was opened for a rite. The wound is small. The weakness is not."

 jen_dragon_court.1410.t: "The Shell Remembers"
 jen_dragon_court.1410.desc: "The Bloodbinder has the egg on a cloth that has seen this work before. A brazier, a knife, a line of old Valyrian that sounds like a promise and a threat in the same breath.\n\nThe shell is cold. Blood is not. Once it is on there, the egg will not forget whose house paid."
 jen_dragon_court.1410.a: "My blood. My line."
 jen_dragon_court.1410.a.tt: "You take the knife. Stress, a year of Let Blood, and the egg is seeded to your house. If you cradle it, it is likelier to hatch. If another house does, it goes cold."
 jen_dragon_court.1410.b: "A kinsman's blood. Same line, not my palm."
 jen_dragon_court.1410.b.tt: "A dragonblood relative at court takes the knife. They bear the stress and the weakness. The egg is seeded to their house."
 jen_dragon_court.1410.c: "Not this egg. Not this year."
 jen_dragon_court.1410.c.tt: "Nothing is painted. The Bloodbinder puts the knife away."
 jen_debug_fire_1410: "Fire: Seed the Egg"

 jen_bind_dragon_rider_decision: "Bind Rider and Dragon"
 jen_bind_dragon_rider_decision_desc: "The Bloodbinder will cut your palm and the dragon's hide and name you together in the old way. For a year it will sit wrong in the blood. If you both live, the bond deepens. If the beast refuses, it does not forget.\n\n#help You need a Bloodbinder and a living dragon you are bound to. Dragonriders only.#!"
 jen_bind_dragon_rider_decision_tooltip: "Bleed with your dragon to deepen the bond, or sour it"
 jen_bind_dragon_rider_decision_confirm: "Call the Bloodbinder"
 jen_bind_dragon_rider_decision_effect_tt: "The Bloodbinder prepares the knife"
 jen_bind_rider_need_pair_tt: "You must still have a living dragon bound to you"
 jen_bind_rider_success_tt: "The year begins. If you both live, the bond will deepen."
 jen_bind_rider_fail_tt: "The dragon will not look at you the same. The bond frays."
 jen_bind_rider_payoff_tt: "The bond takes. Dragon Bond experience."
 jen_bind_rider_payoff_lost_tt: "The year passed. The pair did not."
 jen_blood_bound: "Blood-bound"
 jen_blood_bound_desc: "A rite named you with a dragon. The cut is closed. The year is not."
 jen_dragon_spurned: "Spurned by Dragon"
 jen_dragon_spurned_desc: "The beast turned its head. Court remembers. So do you."

 jen_dragon_court.1420.t: "Name Them Together"
 jen_dragon_court.1420.desc: "The Bloodbinder has a bowl, a knife, and a scrap of Valyrian that does not like to be spoken twice. The dragon is close enough that the heat of it is a second fire in the room.\n\nThey want your palm and a scale's worth of hide. After that, you belong to the year."
 jen_dragon_court.1420.a: "Cut. Name us."
 jen_dragon_court.1420.a.tt: "Stress, and a year of Blood-bound. A capable Bloodbinder helps. Success: the bond pays in about a year if you both live. Failure: the dragon sours, and the bond frays now."
 jen_dragon_court.1420.b: "Not this beast. Not this year."
 jen_dragon_court.1420.b.tt: "The knife stays clean."
 jen_dragon_court.1420.success_toast: "The Blood Takes"
 jen_dragon_court.1420.success_toast_desc: "The dragon did not pull away. The year will tell the rest."
 jen_dragon_court.1420.fail_toast: "The Head Turns"
 jen_dragon_court.1420.fail_toast_desc: "The beast will not look at you. The Bloodbinder wipes the knife and does not speak."
 jen_dragon_court.1421.t: "The Year Named Us"
 jen_dragon_court.1421.desc: "A year since the bowl. The cut is a pale line. The dragon is still here, or it is not. The Bloodbinder said the blood would remember. Tonight you find out what it remembered."
 jen_dragon_court.1421.a: "It knows me."
 jen_dragon_court.1421.b: "The year kept the wrong half."
 jen_debug_fire_1420: "Fire: Bind the Rider"
 jen_debug_fire_1421: "Fire: Bind payoff"
