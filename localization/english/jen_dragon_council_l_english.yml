 task_jen_dragon_chamberlain_bind_houses_effect_desc: "#P +5#! General opinion\n#P +5#! Personal scheme success\n#P +10%#! Diplomacy lifestyle XP"

 JEN_DRAGON_CLICK_TO_HIRE_VOICE: "Click to appoint a Voice of the Fourteen"

 jen_dragon_councillor_voice_of_the_fourteen: "Voice of the Fourteen"
 jen_dragon_councillor_voice_of_the_fourteen_desc: "The $jen_dragon_councillor_voice_of_the_fourteen$ keeps the old flame: rites, glass candles, and the faith of Valyria in every hall of the realm."
