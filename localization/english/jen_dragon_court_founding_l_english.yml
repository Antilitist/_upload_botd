l_english:
 jen_dragon_court_established:0 "The Dragon Court"
 jen_dragon_court_established_desc:0 "This house named pit, yard, and blood offices. The jobs are not ornaments. They are how the beasts are kept."
 jen_establish_dragon_court_decision:0 "Establish the Dragon Court"
 jen_establish_dragon_court_decision_desc:0 "Name the offices the Freehold used: Watcher, Yard, Pitmaster, Wingmaster, Bloodbinder, Scale-scribe, Cradle Nurse, and the three seats beside the council.\n\n#help Your [culture|E] needs The Dragon Court tradition. You need dragonblood, and a living dragon or a live egg. Once named, the jobs belong to your [house|E].#!"
 jen_establish_dragon_court_decision_tooltip:0 "Name the dragon offices for your house"
 jen_establish_dragon_court_decision_confirm:0 "Name the court"
 jen_establish_dragon_court_decision_effect_tt:0 "Your house keeps a Dragon Court. The jobs can be filled."
 jen_establish_dragon_court_effect_tt:0 "House modifier: The Dragon Court. Court jobs and extra council seats unlock."
 jen_establish_become_true_valyrian_tt:0 "You and your capital become Valyrian and True Valyrian"
 jen_establish_need_blood_tt:0 "You need dragonblood"
 jen_establish_need_dragon_or_egg_tt:0 "You need a living dragon or a live egg"
 jen_must_be_available_tt:0 "You must be available"
 jen_dragon_court.1440.t:0 "Name the Offices"
 jen_dragon_court.1440.desc:0 "The yard has been a yard. The pit has been a pit. No one was named for them, so the work has been whoever was standing nearest the chain.\n\nThe old lists still exist. Watcher. Yard Keeper. Pitmaster. Wingmaster. Bloodbinder. Scale-scribe. Cradle Nurse. Three seats that sit beside the council, not on it. Once you speak them, your house is keeping a court, not a menagerie."
 jen_dragon_court.1440.a:0 "Speak the names."
 jen_dragon_court.1440.a.tt:0 "Prestige. Your house unlocks the dragon court jobs and extra council seats. You and your capital become Valyrian and True Valyrian."
 jen_dragon_court.1440.b:0 "Not yet. Let the chain stay a chain."
 jen_dragon_court.1440.b.tt:0 "The offices stay unnamed."
 jen_dragon_court.1440.success_toast:0 "The Court is Named"
 jen_dragon_court.1440.success_toast_desc:0 "The jobs are yours to fill. Pit, yard, and blood are not ornaments."
 jen_debug_fire_1440:0 "Fire: Establish Dragon Court"
 jen_debug_become_true_valyrian:0 "Debug: become Valyrian and True Valyrian"
