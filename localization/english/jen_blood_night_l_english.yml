l_english:
 jen_blood_night_decision:0 "The Blood Night"
 jen_blood_night_decision_desc:0 "Wine. Fire. The old Valyrian pairing. You open the hall and those already bound to you come in: spouses, consorts, lovers, the blooded of your court.\n\nThis is not a feast. This is a rite. You will take a body for yourself, then you may give others to each other. One man may be sent to more than one woman. If you let lust sire children, the morning may carry."
 jen_blood_night_decision_tooltip:0 "Host the pairing rite. Take a body. Give bodies to each other."
 jen_blood_night_decision_confirm:0 "Open the doors. Pour the wine."
 jen_blood_night_decision_effect_tt:0 "You host a Blood Night"
 jen_blood_night_need_partner_tt:0 "You need an adult spouse, concubine, or lover"
 jen_blood_night_cooldown_tt:0 "A Blood Night was held too recently"
 jen_blood_night_named_guest:0 "[THIS.GetTitledFirstName]"
 jen_debug_fire_blood_night:0 "Fire: Blood Night 0001"

 jen_blood_night.0001.t:0 "The Blood Night opens"
 jen_blood_night.0001.desc:0 "The doors take the heat. The hall fills without being asked. Spouses. Consorts. Lovers. Every blooded man and woman of your court. They came because the night is yours.\n\nFire along the stone. Wine dark as a wound. Silk already turned down. You do not pick the beds. The night pairs them. In the morning you will hear who lay with whom. The Fourteen are not named. They do not need to be. This is how it was done when the dragons were many."
 jen_blood_night.0001.a:0 "Let the blooded in"
 jen_blood_night.0001.a.tt:0 "The cups are poured. The night pairs them."

 jen_blood_night.0002.t:0 "Name what the night is for"
 jen_blood_night.0002.desc:0 "Hands find the gold. Talk runs low and close. Mouths find throats. You set the rite before the silk takes anyone.\n\nPleasure is lust for its own sake: anyone may be put with anyone. No one is owed a child.\n\nLust that sires is the old cult work. The heat is still lust, but a man and a fertile woman are paired so the morning may carry. One bed each. Whoever has no opposite sits out."
 jen_blood_night.0002.a:0 "Pleasure. Heat. No heir asked."
 jen_blood_night.0002.a.tt:0 "The night is for lust. Anyone with anyone. No pregnancy."
 jen_blood_night.0002.b:0 "Let lust sire children."
 jen_blood_night.0002.b.tt:0 "The night is lust that leaves children. Man with fertile woman. Leftover sits out. She may carry."

 jen_blood_night.0003.t:0 "The pairing chamber"
 jen_blood_night.0003.desc:0 "The great bed is made. Dragon eggs sit on the table as old props, not a hatch: witnesses in shell, the way the Freehold liked it. Fire in the brazier. Wine on the breath. People take their places around the silk and the stone, already half undressed by the heat.\n\nThe beds are already given. You do not send anyone back. You take what the rite put against you. Dawn names the rest."
 jen_blood_night.0003.a:0 "Let the night take them"
 jen_blood_night.0003.a.tt:0 "The silk is waiting. The pairing is already done."

 jen_blood_night.0010.t:0 "Your bed"
 jen_blood_night.0010.desc:0 "The night has already put a body against yours. You do not send them back. You take what the rite gave."
 jen_blood_night.0010.a:0 "Take them"
 jen_blood_night.0010.a.tt:0 "The pairing stands."
 jen_blood_night.0010.b:0 "I want another body"
 jen_blood_night.0010.b.tt:0 "Choose from the gathered adults."

 jen_blood_night.0011.t:0 "unused"
 jen_blood_night.0011.desc:0 "unused"
 jen_blood_night.0011.a:0 "Continue"
 jen_blood_night.0012.t:0 "unused"
 jen_blood_night.0012.desc:0 "unused"
 jen_blood_night.0012.a:0 "Continue"
 jen_blood_night.0013.t:0 "unused"
 jen_blood_night.0013.desc:0 "unused"
 jen_blood_night.0013.a:0 "Continue"

 jen_blood_night.0014.t:0 "Choose the body you will take"
 jen_blood_night.0014.desc:0 "Another face in the firelight. Another mouth. This is the one you will have against you when the wine is gone.\n\nTake this flesh to your bed, or look once more. The rite waits on your hunger."
 jen_blood_night.0014.a:0 "This one. To my bed."
 jen_blood_night.0014.a.tt:0 "You take this body for yourself."
 jen_blood_night.0014.b:0 "Not this flesh"
 jen_blood_night.0014.b.tt:0 "Look again among the gathered adults."

 jen_blood_night.0015.t:0 "Give them to each other"
 jen_blood_night.0015.desc:0 "Your own pairing is set. The Blood Night is not only your mouth and your bed. You are the one who points.\n\nChoose two. Send them to the silk to take each other: hands, mouths, the full length of the rite. Already claimed does not matter. The man you just took may be given again. A woman already used may be given a man. One man may be put into more than one woman before morning.\n\nThis is the old pairing. You watch. You name who couples. You may do it more than once."
 jen_blood_night.0015.a:0 "Pair two more. Let them couple."
 jen_blood_night.0015.a.tt:0 "Pick two people. They can already have a bed. One man may lie with many."
 jen_blood_night.0015.b:0 "Seal the night. Let them finish."
 jen_blood_night.0015.b.tt:0 "No more pairings. The silk and the lust will do the rest until morning."

 jen_blood_night.0016.t:0 "The first body you will give"
 jen_blood_night.0016.desc:0 "First of the two you will send to each other. Anyone in the hall. Already claimed is not a refusal. A mouth you have already used may still be given to someone else.\n\nPoint. The rite is in the pointing."
 jen_blood_night.0016.a:0 "This flesh. First."
 jen_blood_night.0016.a.tt:0 "They are the first of the pair you will join."
 jen_blood_night.0016.b:0 "Not this one"
 jen_blood_night.0016.b.tt:0 "Look again."

 jen_blood_night.0017.t:0 "The body you join them to"
 jen_blood_night.0017.desc:0 "Second of the two. This is who will take the first, or be taken by them. The same man you already lay with is allowed. The same woman is allowed. You cannot join a body to itself.\n\nIf you let lust sire children, a man put into a woman here may leave her with child, even if he has already spent himself in you."
 jen_blood_night.0017.a:0 "This flesh. Join them."
 jen_blood_night.0017.a.tt:0 "They are the second. These two will couple."
 jen_blood_night.0017.b:0 "Not this one"
 jen_blood_night.0017.b.tt:0 "Look again."

 jen_blood_night.0018.t:0 "Join them on the silk"
 jen_blood_night.0018.desc:0 "These two. You have named them. The hall will watch them take each other: the undressing, the wine still on the mouth, the old pairing done in full.\n\nIf one is a man and one is a woman, and you let lust sire children, he will be put into her. She may carry. He can already have been inside someone else tonight. That is the point of giving him twice.\n\nSend them, or choose different flesh."
 jen_blood_night.0018.a:0 "Let them take each other"
 jen_blood_night.0018.a.tt:0 "They couple. You may pair another two after, if the hunger is not done."
 jen_blood_night.0018.b:0 "Not these two"
 jen_blood_night.0018.b.tt:0 "Start the pairing over. Pick different bodies."

 jen_blood_night.0020.t:0 "After the pairing"
 jen_blood_night.0020.desc:0 "Dawn through the arches. The fire is ash. Wine gone. Silk ruined. The line sleeps where it fell.\n\nThe beds:\n\nThose who stood in the hall carry the rite now. The more nights they keep, the higher they stand in it. If you let lust sire children, the fertile women who had a man inside them may carry. If a guest not of the faith sat in, the hall remembers."
 jen_blood_night.0020.a:0 "Rise. The Blood Night is done."
 jen_blood_night.0020.a.tt:0 "The pairing ends. Blood-Rite XP. Pregnancy chance if lust was set to sire children. Stress down. Dread if a non-Valyrian sat in."
 jen_blood_night.0020.p1:0 "A pairing."
 jen_blood_night.0020.p2:0 "A pairing."
 jen_blood_night.0020.p3:0 "A pairing."
