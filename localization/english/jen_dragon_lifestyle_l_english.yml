 jen_dragon_reins_perk_effect: "Your bonded [dragon|E] gains extra training experience each year."
 jen_dragon_scout_perk_name: "Aerial Scout"
 jen_dragon_dracarys_perk_name: "Dracarys"
 jen_dragon_stormrider_perk_name: "Stormrider"
 jen_dragon_terror_perk_name: "Winged Terror"
