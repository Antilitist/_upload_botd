 action_lifestyle_jen_dragon: "$action_can_spend_perk_point$"
 action_lifestyle_jen_dragon_label: "$action_can_spend_perk_point_label$"
 action_lifestyle_jen_dragon_desc: "$action_can_spend_perk_point_desc$"
 action_lifestyle_jen_dragon_click: "$action_can_spend_perk_point_click$"
 jen_dragon_clutch_perk_effect: "When an egg hatches in your yard, #V First Fire#! fires after a few days. You can leave the hatchling as it hatched."
 jen_dragon_warmth_perk_effect: "A Raising perk is what makes #V First Fire#! fire at all. Without one, the shell decides the hatchling's nature."
 jen_dragon_pitmaster_perk_effect: "You are one perk from unlocking appetite choices in #V The Growing#!, when a yard dragon leaves the hatchling years."
 jen_dragon_scale_perk_effect: "When a yard dragon comes of age, #V The Growing#! can teach #P Restrained#! or #N Voracious#!."
 jen_dragon_keepers_eye_perk_effect: "After First Fire, #V The Yard#! follows. You can raise the hatchling #P Cooperative#! or #N Solitary#!."
 jen_dragon_brood_perk_effect: "The finisher is next. Completing this tree unlocks Fearsome Wyrm and Majestic on the hatchling events."
 jen_dragon_keeper_perk_effect: "You gain the Keeper of Dragons trait. You keep #V First Fire#!, #V The Yard#!, and #V The Growing#! even after you leave Raising. The Yard can make a #P Fearsome Wyrm#!. The Growing can make it #P Majestic#!."

