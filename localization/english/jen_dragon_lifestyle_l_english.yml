 jen_dragon_clutch_perk_name: "Egg Watcher"
 jen_dragon_warmth_perk_name: "Warm Clutch"
 jen_dragon_hatchling_perk_name: "Hatchling's Friend"
 jen_dragon_hatchling_perk_effect: "In #V First Fire#! you can now teach the hatchling #P Friendly#! or #N Aggressive#!, not only leave the blood as it is."
 jen_dragon_pitmaster_perk_name: "Pit Master"
 jen_dragon_scale_perk_name: "Scale and Bone"
 jen_dragon_keepers_eye_perk_name: "Keeper's Eye"
 jen_dragon_brood_perk_name: "Brood of Fire"
 jen_dragon_keeper_perk_name: "Keeper of Dragons"

 jen_dragon_blood_perk_name: "Blood Remembers"
 jen_dragon_valyrian_perk_name: "High Valyrian"
 jen_dragon_claim_perk_name: "Claimant's Call"
 jen_dragon_claim_perk_effect: "You have an easier time claiming and deepening a bond with a [dragon|E]."
 jen_dragon_seed_perk_name: "Dragonseed's Eye"
 jen_dragon_pulse_perk_name: "Shared Pulse"
 jen_dragon_pulse_perk_effect: "Your bond with your [dragon|E] deepens a little each year."
 jen_dragon_house_perk_name: "House of the Dragon"
 jen_dragon_flesh_perk_name: "Fire Made Flesh"
 jen_dragonlord_perk_name: "Dragonlord"

 trait_jen_wyrmrider: "Wyrmrider"
 trait_jen_wyrmrider_desc: "This character rides as if born to the saddle of a dragon, and the skies answer them."
 trait_jen_wyrmrider_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] rides as if born to the saddle of a dragon."
 trait_jen_dragon_keeper: "Keeper of Dragons"
 trait_jen_dragon_keeper_desc: "This character has mastered the yard. Hatchlings in their care still get First Fire, The Yard, and The Growing, even if they have left the Raising focus."
 trait_jen_dragon_keeper_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] knows the yard, the pit, and the stubborn hunger of growing wyrms."
 trait_jen_dragonlord: "Dragonlord"
 trait_jen_dragonlord_desc: "This character carries the old Valyrian claim: blood, bond, and the right to rule fire."
 trait_jen_dragonlord_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] carries the old Valyrian claim: blood, bond, and the right to rule fire."

 jen_dragon_lifestyle.1000.t: "Dawn Flight"
 jen_dragon_lifestyle.1000.desc: "The air is thin and cold before the sun clears the walls. Below, the yard is still. Up here there is only wingbeat, and the heat of a living furnace under the saddle."
 jen_dragon_lifestyle.1000.a: "Drill until the turns are clean."
 jen_dragon_lifestyle.1000.b: "Circle the keep. Let them look up."

 jen_dragon_lifestyle.1010.t: "The Clutch"
 jen_dragon_lifestyle.1010.desc: "Keepers argue over heat, straw, and whether the egg has shifted in the night. Someone has to decide if this is husbandry or superstition."
 jen_dragon_lifestyle.1010.a: "Stay with the clutch until morning."
 jen_dragon_lifestyle.1010.b: "Sell a share of the feed stores and call it practical."

 jen_dragon_lifestyle.1020.t: "Old Words"
 jen_dragon_lifestyle.1020.desc: "High Valyrian sits strangely on a Westerosi tongue, but dragons do not care for the Common Speech. You try the words again, slower, until they stop sounding like a mummer's charm."
 jen_dragon_lifestyle.1020.a: "Speak until the beast answers."
 jen_dragon_lifestyle.1020.b: "Recite them in court, for the legend of it."

 jen_dragon_lifestyle.1030.t: "Dragon Dreams"
 jen_dragon_lifestyle.1030.desc: "You wake with smoke in your mouth and the memory of a city that is not yours. Fire does not ask permission in dreams."
 jen_dragon_lifestyle.1030.a: "Write it down. Dreams can be warnings."
 jen_dragon_lifestyle.1030.b: "Let the fire have its say. Men should fear it."

 jen_dragon_raising.1000.t: "First Fire"
 jen_dragon_raising.1000.desc: "The hatchling is still wet from the shell. Keepers argue whether a beast this young can be taught anything but hunger. You have spent enough hours in the yard to know that is only half true."
 jen_dragon_raising.1000.a: "Leave it to the blood."
 jen_dragon_raising.1000.b: "Reward calm. Teach it to take food from the hand."
 jen_dragon_raising.1000.c: "Reward heat. Let it snap, and praise the snap."
 jen_dragon_raising.1001.t: "The Yard"
 jen_dragon_raising.1001.desc: "A second keeper asks whether the hatchling should learn the company of other beasts, or the silence of its own pit."
 jen_dragon_raising.1001.a: "Not today."
 jen_dragon_raising.1001.b: "Keep it among the others."
 jen_dragon_raising.1001.c: "A pit of its own."
 jen_dragon_raising.1001.d: "Feed it richer. Let the frame fill out."
 jen_dragon_raising.1010.t: "The Growing"
 jen_dragon_raising.1010.desc: "The dragon is no longer a wet thing in straw. It has learned your step, and the smell of the yard. This is the last easy year to set its appetite, or to let the old hunger win."
 jen_dragon_raising.1010.a: "Leave it."
 jen_dragon_raising.1010.b: "Measure the meat. Teach restraint."
 jen_dragon_raising.1010.c: "Let it gorge. A dragon should not learn want."
 jen_dragon_raising.1010.d: "Oil the scales. Let them take the light."
 jen_dragon_raising.1000.a.tt: "Nothing changes. This hatchling keeps the temperament it hatched with — it will not become Friendly or Aggressive from you."
 jen_dragon_raising.1000.b.tt: "This hatchling becomes #P Friendly#!. If it is Aggressive, that trait is removed."
 jen_dragon_raising.1000.c.tt: "This hatchling becomes #N Aggressive#!. If it is Friendly, that trait is removed."
 jen_dragon_raising.next_choice_tt: "A second choice follows while it is still young, because your Raising tree is deep enough."
 jen_dragon_raising.1001.a.tt: "Nothing changes. Its sociability stays as it hatched — it will not become Cooperative or Solitary from this."
 jen_dragon_raising.1001.b.tt: "This hatchling becomes #P Cooperative#!. If it is Solitary, that trait is removed."
 jen_dragon_raising.1001.c.tt: "This hatchling becomes #N Solitary#!. If it is Cooperative, that trait is removed."
 jen_dragon_raising.1001.d.tt: "This hatchling becomes #P Fearsome Wyrm#!. If it is Unhealthy Wyrm, that trait is removed. Personality is left as it is."
 jen_dragon_raising.1010.a.tt: "Nothing changes. Appetite and bearing stay as they are — it will not become Restrained, Voracious, or Majestic from this."
 jen_dragon_raising.1010.b.tt: "This dragon becomes #P Restrained#!. If it is Voracious, that trait is removed."
 jen_dragon_raising.1010.c.tt: "This dragon becomes #N Voracious#!. If it is Restrained, that trait is removed."
 jen_dragon_raising.1010.d.tt: "This dragon becomes #P Majestic#!. If it is Ugly, that trait is removed."
 jen_dragon_raising.leave_tt: "Nothing changes. The hatchling keeps the nature it already has."
