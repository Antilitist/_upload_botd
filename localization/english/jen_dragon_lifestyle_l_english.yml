l_english:
 jen_dragon_lifestyle_name: "Blood of the Dragon"
 jen_dragon_lifestyle_desc: "Study the saddle, the yard, and the bond. Dragons are not horses, and those who treat them as such rarely keep them long."
 jen_dragon_lifestyle_highlight_desc: "Your blood and training with dragons make this Lifestyle come more naturally."
 game_concept_jen_dragon_lifestyle: "Blood of the Dragon"
 game_concept_jen_dragon_lifestyle_i: "$game_concept_jen_dragon_lifestyle$"
 game_concept_jen_dragon_lifestyle_desc: "A lifestyle for those who ride, raise, and bind dragons."
 jen_need_dragonblood_tt: "You need some [dragonblood|E]"


 jen_dragon_riding_focus: "Riding Focus"
 jen_dragon_riding_focus_short: "Riding"
 jen_dragon_riding_focus_desc: "The air is a second battlefield. A rider who cannot keep their seat will not keep their dragon."
 jen_dragon_riding_focus_effect_desc: "Focusing on Riding grants:"
 jen_dragon_riding_name: "Wyrmrider"

 jen_dragon_raising_focus: "Raising Focus"
 jen_dragon_raising_focus_short: "Raising"
 jen_dragon_raising_focus_desc: "Eggs, pits, and keepers. Hatchlings in your yard get #V First Fire#!, then #V The Yard#!, then #V The Growing#! as this tree deepens."
 jen_dragon_raising_focus_effect_desc: "Focusing on Raising grants:"
 jen_dragon_raising_name: "Keeper of Dragons"

 jen_dragon_bonding_focus: "Bonding Focus"
 jen_dragon_bonding_focus_short: "Bonding"
 jen_dragon_bonding_focus_desc: "The old blood remembers. Claim, keep, and bind what fire will allow."
 jen_dragon_bonding_focus_effect_desc: "Focusing on Bonding grants:"
 jen_dragon_bonding_name: "Dragonlord"

 jen_dragon_saddle_perk_name: "Saddle-Born"
 jen_dragon_skyward_perk_name: "Skyward"
