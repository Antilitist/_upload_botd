l_english:
 jen_dragon_knights:0 "Dragon Knights"
 jen_dragon_knights_flavor:0 "#F Heavy horse of the Freehold. They ride as if a dragon were still above them, and infantry that holds against that charge does not hold long.#!"

 jen_valyrian_horsemen:0 "Knights of Valyrian Horsemen"
 jen_valyrian_horsemen_flavor:0 "#F Lighter than the Dragon Knights, faster in the hunt. Valyrian horsemen screen the blood army and run down what breaks.#!"

 jen_valyrian_archers:0 "Valyrian Archers"
 jen_valyrian_archers_flavor:0 "#F Ranked bowmen drilled to shoot in the open and from walls. They pick knights from the saddle and skirmishers from the grass.#!"

 jen_dragon_footmen:0 "Dragon Footmen"
 jen_dragon_footmen_flavor:0 "#F Heavy foot of the old host. They take the charge of light horse and the rain of arrows, and they do not give the ground cheaply.#!"
