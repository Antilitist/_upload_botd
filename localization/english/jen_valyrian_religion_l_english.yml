l_english:
 # Religion
 jen_valyrian_religion:0 "The Old Blood"
 jen_valyrian_religion_adj:0 "Old Blood"
 jen_valyrian_religion_adherent:0 "Blood-sworn"
 jen_valyrian_religion_adherent_plural:0 "Blood-sworn"
 jen_valyrian_religion_desc:0 "Older than the Freehold's polite temples, the Old Blood is the dragonlords' private creed: fire, kin, and sorcery. It is not the public faith of the Freehold. It does not welcome other gods. Valyrian blood is a sacrament, dragons are living gods, and lesser peoples exist to serve, feed, or burn."

 # Faith
 jen_valyrian:0 "Valyrian"
 jen_valyrian_adj:0 "Valyrian"
 jen_valyrian_adherent:0 "Valyrian"
 jen_valyrian_adherent_plural:0 "Valyrians"
 jen_valyrian_desc:0 "The Valyrian faith is the unsoftened rite of the dragonlords, and it is intolerant on purpose. It names Balerion, Vhagar, Meraxes, and Syrax among the Fourteen, holds close-kin marriage as holy, and treats blood magic as worship. The Fourteen Flames of the Freehold welcomed other gods. This creed does not. Other faiths are error. Power is proof of favor. Purity is law."

