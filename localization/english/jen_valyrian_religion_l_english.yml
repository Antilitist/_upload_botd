 # Doctrine groups
 doctrine_jen_valyrian_tenets_name:0 "Valyrian Rites"
 doctrine_jen_valyrian_tenets_desc:0 "The three laws of the dragonlords: dragons, blood, and kin."
 doctrine_jen_old_blood_laws_name:0 "Old Blood Laws"
 doctrine_jen_old_blood_laws_desc:0 "Supremacy, sorcery, and fire-and-blood: the private laws of the old race, kept as doctrine rather than temple rite."

 # Special doctrine (hidden, loc still required)
 special_doctrine_jen_is_valyrian_faith_name:0 "Old Blood"
 special_doctrine_jen_is_valyrian_faith_desc:0 "This faith keeps the unsoftened Valyrian rites of blood, dragons, and sorcery."
 jen_is_valyrian_faith_name:0 "$special_doctrine_jen_is_valyrian_faith_name$"

 # Custom tenets
 tenet_jen_dragon_worship_name:0 "Dragon Worship"
 tenet_jen_dragon_worship_desc:0 "Dragons are not beasts. They are fire given flesh, living gods who choose riders as a temple chooses priests. To slay one is blasphemy. To bond one is the highest sacrament."
 tenet_jen_blood_of_the_fourteen_name:0 "Blood of the Fourteen"
 tenet_jen_blood_of_the_fourteen_desc:0 "The Fourteen Flames did not only burn. They taught. Blood opened the old doors: steel, flesh, and the will of fire. What the Doom buried, the rite still names lawful."
 tenet_jen_kin_of_fire_name:0 "Kin of Fire"
 tenet_jen_kin_of_fire_desc:0 "The blood must not be thinned. Several close-kin spouses are holy: brother weds sister, cousin weds cousin, uncle weds niece."
 tenet_jen_unmixed_blood_name:0 "Unmixed Blood"
 tenet_jen_unmixed_blood_desc:0 "Marry inside the dynasty. Outsiders thin the fire."
 tenet_jen_sister_wife_name:0 "Sister-Wife"
 tenet_jen_sister_wife_desc:0 "The second sister-wife is the point. Several close-kin spouses please the Fourteen."
 tenet_jen_blood_wives_name:0 "Blood-Wives"
 tenet_jen_blood_wives_desc:0 "Spouses and concubines for men and women. Same-sex marriage is allowed. Who shares the bed is yours to choose."
 tenet_jen_fourteen_mines_name:0 "The Fourteen Mines"
 tenet_jen_fourteen_mines_desc:0 "Slavery is a craft. The Flames were fed by mines and lesser peoples."
 tenet_jen_blood_forged_name:0 "Blood-Forged"
 tenet_jen_blood_forged_desc:0 "Steel remembers blood. Knights and smiths of the faith hit harder."
 tenet_jen_flesh_of_the_flames_name:0 "Flesh of the Flames"
 tenet_jen_flesh_of_the_flames_desc:0 "Children of close-kin parents keep the old shape: health, beauty, or pure blood."
 tenet_jen_riders_sacrament_name:0 "The Rider's Sacrament"
 tenet_jen_riders_sacrament_desc:0 "Dragonriders are the faith's living priests. To ride is to serve."
 tenet_jen_no_soft_gods_name:0 "No Soft Gods"
 tenet_jen_no_soft_gods_desc:0 "Other faiths are error. The Freehold's polite temples were a lie."
 tenet_jen_the_forty_name:0 "The Forty"
 tenet_jen_the_forty_desc:0 "The old families still count. Outsiders stay outsiders."
 tenet_jen_stone_shapers_name:0 "Stone-Shapers"
 tenet_jen_stone_shapers_desc:0 "The old craft of shaping stone. Domain and learning, not a spell school."
 tenet_jen_high_speech_name:0 "High Speech"
 tenet_jen_high_speech_desc:0 "High Valyrian is holy tongue. Prestige and learning."
 tenet_jen_only_flame_name:0 "Only Flame"
 tenet_jen_only_flame_desc:0 "No graven gods. Fire is the image."
 tenet_jen_blood_returns_name:0 "The Blood Returns"
 tenet_jen_blood_returns_desc:0 "The old dragonlords come back in the blood."
 tenet_jen_dragonlord_kings_name:0 "Dragonlord Kings"
 tenet_jen_dragonlord_kings_desc:0 "The rider is a living god-king."
 tenet_jen_guile_and_blood_name:0 "Blood Plots"
 tenet_jen_guile_and_blood_desc:0 "Guile and blood. The old houses keep their power in the dark."
 tenet_jen_skulls_of_the_lesser_name:0 "Skulls of the Lesser"
 tenet_jen_skulls_of_the_lesser_desc:0 "Heads of lesser men. Dread from the kill."

 doctrine_jen_blood_wives_name:0 "Blood-Wives"
 doctrine_jen_blood_wives_desc:0 "Forty spouses and forty concubines, for men and for women. Who is a wife and who is a concubine is yours to choose."
 doctrine_jen_blood_wives_religion_tt:0 "Only [GetReligionByKey('jen_valyrian_religion').GetName] may take this marriage law"
 tenet_jen_blood_wives_requires_law_tt:0 "Requires the Blood-Wives marriage law"
 jen_blood_wives_wife_requires_dragonblood_tt:0 "A wife must have dragonblood"
 jen_blood_wives_concubine_forbids_dragonblood_tt:0 "Concubines are for those without the blood"

 jen_sister_wife_active:0 "Sister-Wives"
 jen_sister_wife_active_desc:0 "At least two living spouses are close kin."
 jen_rider_sacrament_active:0 "Rider's Sacrament"
 jen_rider_sacrament_active_desc:0 "A dragonrider serving as a living priest of the faith."
 jen_gods_that_walk_active:0 "Gods That Walk"
 jen_gods_that_walk_active_desc:0 "A living dragon or egg is kept. The old gods still walk."

 tenet_jen_blood_remembers_name:0 "The Blood Remembers"
 tenet_jen_blood_remembers_desc:0 "The scripture is the bloodline, not a book."
 tenet_jen_gods_that_walk_name:0 "Gods That Walk"
 tenet_jen_gods_that_walk_desc:0 "Dragons and eggs are living gods. Piety comes from keeping them, not from every believer."
 tenet_jen_unsoftened_flame_name:0 "Unsoftened Flame"
 tenet_jen_unsoftened_flame_desc:0 "No mercy gods. The Seven are error. Other faiths are error."
 tenet_jen_nightfires_name:0 "Nightfires"
 tenet_jen_nightfires_desc:0 "Night fire-rites. Calm the blood, keep the court afraid."

 doctrine_parameter_jen_blood_remembers:0 "The scripture is the bloodline"
 doctrine_parameter_jen_gods_that_walk:0 "Keeping a living dragon or egg grants [piety|E]"
 doctrine_parameter_jen_unsoftened_flame:0 "Other [faiths|E] are error. No mercy gods"
 doctrine_parameter_jen_nightfires:0 "Night fire-rites: less [stress|E], more [dread|E] and [piety|E]"

 jen_doctrine_group_valyrian_supremacy_name:0 "Valyrian Supremacy"
 jen_doctrine_group_sorcerous_arts_name:0 "Sorcerous Arts"
 jen_doctrine_group_fire_and_blood_name:0 "Fire and Blood"

 doctrine_jen_valyrian_supremacy_name:0 "Valyrian Supremacy"
 doctrine_jen_valyrian_supremacy_desc:0 "The world was made to kneel. Valyrian blood is the measure of a soul. Lesser peoples may serve, pay, or burn; they may not rule the dragonlords."
 doctrine_jen_sorcerous_arts_name:0 "Sorcerous Arts"
 doctrine_jen_sorcerous_arts_desc:0 "Witchcraft is not a crime among dragonlords. It is a craft, a court art, and a weapon. Mystics and bloodmages are honored, and the old workings are kept against the day they wake again."
 doctrine_jen_fire_and_blood_name:0 "Fire and Blood"
 doctrine_jen_fire_and_blood_desc:0 "Mercy is a word for people who cannot fly. War is worship. Conquest is the natural law of a rider, and the clergy of flame are expected to fight."

