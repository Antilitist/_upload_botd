l_english:
 jen_kin_oath_decision: "Swear a Kin-Oath"
 jen_kin_oath_decision_desc: "The Bloodbinder will cut two dragonblood palms and name you to each other. If one of you dies, the other will know. Not a raven. A night-terror.\n\n#help You need a Bloodbinder and another living dragonblood of your blood or at court. One oath at a time. Without living dragons the rite mostly sickens.#!"
 jen_kin_oath_decision_tooltip: "Bleed with a kinsman so death cannot hide"
 jen_kin_oath_decision_confirm: "Call the Bloodbinder"
 jen_kin_oath_decision_effect_tt: "The Bloodbinder prepares the bowl"
 jen_kin_oath_need_kin_tt: "You need another living dragonblood to swear with"
 jen_break_kin_oath_decision: "Break the Kin-Oath"
 jen_break_kin_oath_decision_desc: "Ask the Bloodbinder to unmake the naming. The other half will know. The binder will sicken. That is the price of taking it back.\n\n#help You must already be oath-bound. The Bloodbinder pays in health.#!"
 jen_break_kin_oath_decision_tooltip: "Unmake the oath. The Bloodbinder sickens."
 jen_break_kin_oath_decision_confirm: "Cut it anyway"
 jen_break_kin_oath_decision_effect_tt: "The Bloodbinder is told to unmake it"
 jen_break_kin_oath_need_tt: "You must already be named to someone"
 jen_kin_oath_success_tt: "You are named. If one dies, the other will know."
 jen_kin_oath_fail_tt: "The blood went sour. Fever. The naming did not take."
 jen_kin_oath_break_tt: "The oath is cut. The Bloodbinder sickens."
 jen_kin_oath_bound: "Kin-Oath"
 jen_kin_oath_bound_desc: "Two palms. One naming. If they die, you will know."
 jen_oath_widow: "The Other Half"
 jen_oath_widow_desc: "You woke knowing. No raven had come."
 jen_oath_broken: "Oath-Breaker"
 jen_oath_broken_desc: "You had the naming taken off. Court remembers the asking."
 jen_blood_fever: "Blood-Fever"
 jen_blood_fever_desc: "The bowl went wrong. The cut did not close clean."
 jen_binder_sickens: "Binder's Sickness"
 jen_binder_sickens_desc: "They unmade a naming. The old words do not like to be unspoken."
 jen_dragon_court.1430.t: "Name the Blood"
 jen_dragon_court.1430.desc: "Two cups. One knife. The Bloodbinder does not look at either of you while they speak the Valyrian. They said that is how it was done when the dragons were many.\n\nIf it takes, you will know when the other dies. If it fails, you will know sooner, in the blood."
 jen_dragon_court.1430.a: "Cut with [oath_kin_1.GetFirstName]"
 jen_dragon_court.1430.a.tt: "Gold, prestige, stress. Without living dragons the rite mostly sickens. A capable Bloodbinder helps."
 jen_dragon_court.1430.b: "Cut with [oath_kin_2.GetFirstName]"
 jen_dragon_court.1430.b.tt: "Gold, prestige, stress. Without living dragons the rite mostly sickens. A capable Bloodbinder helps."
 jen_dragon_court.1430.c: "Cut with [oath_kin_3.GetFirstName]"
 jen_dragon_court.1430.c.tt: "Gold, prestige, stress. Without living dragons the rite mostly sickens. A capable Bloodbinder helps."
 jen_dragon_court.1430.d: "Not this blood. Not this year."
 jen_dragon_court.1430.d.tt: "The knife stays clean."
 jen_dragon_court.1430.success_toast: "Named Together"
 jen_dragon_court.1430.success_toast_desc: "The Bloodbinder ties the cloth. If one of you dies, the other will wake knowing."
 jen_dragon_court.1430.fail_toast: "The Bowl Goes Sour"
 jen_dragon_court.1430.fail_toast_desc: "Fever. The naming did not take. Maesters will call it a cut that should have been boiled."
 jen_dragon_court.1431.t: "You Already Knew"
 jen_dragon_court.1431.desc: "No raven. No rider. You woke with the taste of the bowl in your mouth and a name that would not leave. [dead_kin.GetFirstName] is dead. The Bloodbinder said you would know. They did not say it would feel like this."
 jen_dragon_court.1431.a: "Light no candle."
 jen_dragon_court.1432.t: "Unmake It"
 jen_dragon_court.1432.desc: "The Bloodbinder does not sit. They already know what you came to ask. Unmaking a naming is not the same as never having made it. They will sicken. The other half will know you asked."
 jen_dragon_court.1432.a: "Unmake it. Pay their health."
 jen_dragon_court.1432.a.tt: "The Bloodbinder sickens. The other half learns the oath was cut. You both wear Oath-Breaker."
 jen_dragon_court.1432.b: "Leave the naming."
 jen_dragon_court.1432.b.tt: "The oath stands."
 jen_dragon_court.1433.t: "They Asked It Off"
 jen_dragon_court.1433.desc: "You did not dream a death. You dreamed a asking. Someone took the naming off. The Bloodbinder did the cut. You are not bound. You are not told why."
 jen_dragon_court.1433.a: "So they were afraid of knowing."
 jen_debug_fire_1430: "Fire: Kin-oath"
 jen_debug_fire_1431: "Fire: Kin-oath death"
 jen_debug_fire_1432: "Fire: Kin-oath break"
