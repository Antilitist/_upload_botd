l_english:
 jen_seek_valyrian_relic_decision:0 "Seek a Relic of Old Valyria"
 jen_seek_valyrian_relic_decision_desc:0 "Gold. Prestige. A ship or a hard road. You go looking for one thing the Doom did not eat. You may come home with a spear, a book, a crown, a candle. You may come home with a scar."
 jen_seek_valyrian_relic_decision_tooltip:0 "Set out for one Old Valyria relic"
 jen_seek_valyrian_relic_decision_confirm:0 "Set out"
 jen_seek_valyrian_relic_decision_effect_tt:0 "You choose a site and risk the trip"

 jen_light_glass_candle_decision:0 "Light the Glass Candle"
 jen_light_glass_candle_decision_desc:0 "The glass takes fire. You pay in piety and sleep. One distant court opens in the flame. You may watch a ruler, and for a time schemes against them come easier."
 jen_light_glass_candle_decision_tooltip:0 "See a distant ruler in the glass"
 jen_light_glass_candle_decision_confirm:0 "Light it"
 jen_light_glass_candle_decision_effect_tt:0 "Stress. Then a scheme bonus against one ruler for a time."

 jen_debug_give_all_relics_decision:0 "DEBUG: Give all Valyrian relics"
 jen_debug_give_all_relics_decision_desc:0 "Cheat. Puts every Seek-a-Relic piece in your inventory so you can check icons and names. Unique world stamps are cleared first, then re-set."
 jen_debug_give_all_relics_decision_tooltip:0 "Spawn all BotD Seek relics"
 jen_debug_give_all_relics_decision_confirm:0 "Give them"
 jen_debug_give_all_relics_decision_effect_tt:0 "All Seek relics added to inventory"

 jen_debug_fire_relic_expedition:0 "Fire: Relic expedition 0001"
 jen_art_circlet_need_court_tt:0 "Requires an established Dragon Court"

 jen_relic_expedition.0001.t:0 "Where the Doom still sits"
 jen_relic_expedition.0001.desc:0 "Maps lie. The Smoking Sea still cooks the hulls. Manses stand with no lords in them. The Fourteen keep a shrine that kills the curious. Thieves hide what they stole from all three.\n\nPick one road. Come back with one thing, or with less of yourself."
 jen_relic_expedition.0001.a:0 "The Smoking Sea wreck"
 jen_relic_expedition.0001.a.tt:0 "Books. Glass. Wet and cursed."
 jen_relic_expedition.0001.b:0 "A ruined dragonlord manse"
 jen_relic_expedition.0001.b.tt:0 "Armor. Circlets. Ledgers."
 jen_relic_expedition.0001.c:0 "A shrine of the Fourteen"
 jen_relic_expedition.0001.c.tt:0 "The rarest relics. High chance of death."
 jen_relic_expedition.0001.d:0 "A stolen vault"
 jen_relic_expedition.0001.d.tt:0 "Intrigue. Less death. Someone already looted the rest."

 jen_relic_expedition.0010.t:0 "Black water"
 jen_relic_expedition.0010.desc:0 "The wreck is a ribcage in the steam. Glass in the silt. Pages that still stink of smoke. The sea wants a price for reaching in."
 jen_relic_expedition.0010.a:0 "Reach"

 jen_relic_expedition.0011.t:0 "Ash halls"
 jen_relic_expedition.0011.desc:0 "The doors hang. Dragonlord stone, fused and proud. Dust on a circlet. Scale that still cuts. A ledger of who bled for whom. The house is gone. The things are not."
 jen_relic_expedition.0011.a:0 "Enter"

 jen_relic_expedition.0012.t:0 "The shrine"
 jen_relic_expedition.0012.desc:0 "Fourteen names cut in the floor. Heat in the rock. This is where the curious come to die well. Kneel, take, and hope the Fourteen are idle."
 jen_relic_expedition.0012.a:0 "Kneel"

 jen_relic_expedition.0013.t:0 "The cache"
 jen_relic_expedition.0013.desc:0 "Not a holy place. A lock, a lie, a box someone else already risked. Magisters and septons both steal. You steal last."
 jen_relic_expedition.0013.a:0 "Take it"

 jen_relic_expedition.0020.t:0 "A relic of Old Valyria"
 jen_relic_expedition.0020.desc:0 "The road paid. [jen_new_relic.GetName] is in your hands. It is real."
 jen_relic_expedition.0020.a:0 "Mine."

 jen_relic_expedition.0021.t:0 "The road did not pay"
 jen_relic_expedition.0021.fake:0 "You brought home [jen_new_relic.GetName]. Pretty. False. Someone sold you a story."
 jen_relic_expedition.0021.shell:0 "You brought home [jen_new_relic.GetName]. A dragon egg that will never hatch. Keep it as a warning, not a hope."
 jen_relic_expedition.0021.companion:0 "No relic. [jen_dead_companion.GetTitledFirstName] did not come back. You did."
 jen_relic_expedition.0021.companion_generic:0 "No relic. A companion did not come back. You did."
 jen_relic_expedition.0021.wound:0 "No relic. The trip cut you. You come home bleeding and empty-handed."
 jen_relic_expedition.0021.curse:0 "No relic. The wreck still has you. Steam in the dreams. The body is not done paying."
 jen_relic_expedition.0021.nothing:0 "No relic. The road took its price in sleep and came back with nothing in the hand."
 jen_relic_expedition.0021.a:0 "Done"

 jen_relic_candle.0001.t:0 "The flame in the glass"
 jen_relic_candle.0001.desc:0 "The candle drinks. Three faces rise in the glass. Pick by the portrait. Watch that court. Then let it go out, or it will keep your sleep."
 jen_relic_candle.0001.a:0 "The first"
 jen_relic_candle.0001.b:0 "The second"
 jen_relic_candle.0001.c:0 "The third"
 jen_relic_candle.0001.d:0 "Let it go out"
 jen_relic_candle.0001.d.tt:0 "Nothing. The glass cools."


 jen_relic_sea_curse_modifier:0 "Sea Curse"
 jen_relic_sea_curse_modifier_desc:0 "The wreck still has you. Steam in the dreams. The body is not done paying."
 jen_glass_candle_focus_modifier:0 "Glass-Candle Watch"
 jen_glass_candle_focus_modifier_desc:0 "You have seen that court in the glass. Schemes against them come easier for a time."
 jen_art_book_songs_modifier:0 "$jen_art_book_songs_of_the_fourteen$"
 jen_art_book_treatise_modifier:0 "$jen_art_book_glass_treatise$"
 jen_art_book_ledger_modifier:0 "$jen_art_book_blood_ledger$"
