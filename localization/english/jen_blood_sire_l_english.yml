l_english:
 jen_dragon_blood_sire_court_position:0 "The Blood-Sire"
 jen_dragon_blood_sire_court_position_desc:0 "A Valyrian man of clean flesh and more than half dragonblood. He is kept at court so the old line can be put into a womb you name. Not a husband. A sire."
 jen_dragon_blood_sire_employer_custom_effect_description:0 "$BULLET$You may open the Rite of the Dragonseed for a woman of your court\n$BULLET$The child, if it takes, carries his dragonblood"

 jen_send_to_blood_sire_decision:0 "Rite of the Dragonseed"
 jen_send_to_blood_sire_decision_desc:0 "The Blood-Sire is already chosen. In the old way you name a woman of your court for the silk chamber — not a marriage, a rite — so the dragonblood goes forward. If it takes, she carries."
 jen_send_to_blood_sire_decision_tooltip:0 "Open the rite. Name who takes the Blood-Sire."
 jen_send_to_blood_sire_decision_confirm:0 "Open the chamber"
 jen_send_to_blood_sire_decision_effect_tt:0 "You name who takes his seed in the rite"
 jen_send_to_blood_sire_need_sire_tt:0 "You need a Blood-Sire appointed"
 jen_send_to_blood_sire_need_woman_tt:0 "You need an adult woman at court who is not already with child"
 jen_blood_sire_need_blood_tt:0 "More than 50% dragonblood"
 jen_blood_sire_need_clean_flesh_tt:0 "No negative congenital traits"
 jen_blood_sire_need_male_tt:0 "Must be a man"

 jen_blood_sire.0001.t:0 "Name her for the rite"
 jen_blood_sire.0001.desc:0 "The chamber is ready. The Blood-Sire waits on the silk.\n\nYou do not choose him. You choose who takes him — an adult woman of your court, not already carrying — so the dragonseed may take root."
 jen_blood_sire.0001.a:0 "This one. Begin the rite."
 jen_blood_sire.0001.a.tt:0 "She enters the chamber. Pregnancy chance. His dragonblood if it takes."
 jen_blood_sire.0001.b:0 "Another woman"
 jen_blood_sire.0001.b.tt:0 "Look again among the court."
 jen_blood_sire.0001.c:0 "Close the chamber"
 jen_blood_sire.0001.c.tt:0 "No rite tonight."

 jen_blood_sire.0002.t:0 "The dragonseed is given"
 jen_blood_sire.0002.desc:0 "You named her. He was already chosen. Silk, wine, the old pairing — for the blood, not for a marriage.\n\nIf it takes, she will know in the weeks that follow. The child, if there is one, carries him."
 jen_blood_sire.0002.a:0 "Let the line go forward"
 jen_blood_sire.0002.a.tt:0 "The rite is done. She may carry."
